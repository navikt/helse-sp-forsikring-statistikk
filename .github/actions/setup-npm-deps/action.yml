name: Setup npm deps
description: Install npm dependencies

inputs:
  NPM_AUTH_TOKEN:
    required: true
    description: Github reader token

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: 'pnpm'
    # pnpm >= 10.33 ignorerer auth-tokens i prosjektets .npmrc, så tokenet må
    # settes i runnerens bruker-config før install.
    - shell: bash
      run: pnpm config set --global "//npm.pkg.github.com/:_authToken" "$NPM_AUTH_TOKEN"
      env:
        NPM_AUTH_TOKEN: ${{ inputs.NPM_AUTH_TOKEN }}
    - shell: bash
      run: pnpm install --frozen-lockfile
      env:
        NPM_AUTH_TOKEN: ${{ inputs.NPM_AUTH_TOKEN }}
