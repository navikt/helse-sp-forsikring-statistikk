name: deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 3'
      timezone: 'Europe/Oslo'
  workflow_dispatch:

env:
  APP: sp-forsikring-statistikk
  TEAM: tbd

permissions:
  contents: read
  id-token: write

jobs:
  test-and-lint:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer deps
        uses: ./.github/actions/setup-npm-deps
        with:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: pnpm run typecheck
      - run: pnpm run test

  build:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer deps
        uses: ./.github/actions/setup-npm-deps
        with:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - run: pnpm run build
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        name: Build and push image
        id: docker-build-push
        with:
          team: ${{ env.TEAM }}
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-dev:
    name: Deploy to dev
    needs: [build, test-and-lint]
    runs-on: ubuntu-latest
    permissions:
      id-token: 'write'
    environment:
      name: dev
      url: https://sp-forsikring-statistikk.intern.dev.nav.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais.yaml
          VARS: .nais/dev.yaml
          VAR: 'image=${{ needs.build.outputs.image }},team=${{ env.TEAM }},app=${{ env.APP }}'

  deploy-prod:
    name: Deploy to prod
    needs: [build, test-and-lint, deploy-dev]
    runs-on: ubuntu-latest
    permissions:
      id-token: 'write'
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://sp-forsikring-statistikk.intern.nav.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/nais.yaml
          VARS: .nais/prod.yaml
          VAR: 'image=${{ needs.build.outputs.image }},team=${{ env.TEAM }},app=${{ env.APP }}'
