version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "⬆️ "
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "navikt/sykepenger-github-workflows*"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    commit-message:
      prefix: "⬆️ "
    schedule:
      interval: "daily"
    registries: "*"
    cooldown:
      default-days: 7
    groups:
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
      # Released in lockstep with identical versions (changesets "fixed" group in navikt/aksel)
      aksel:
        patterns:
          - "@navikt/ds-react"
          - "@navikt/ds-css"
          - "@navikt/ds-tokens"
          - "@navikt/ds-tailwind"
          - "@navikt/aksel-icons"
          - "@navikt/aksel"
          - "@navikt/aksel-stylelint"
